[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2audio"
version = "0.1.0"
description = "A simple, open-source tool that converts PDFs into audiobooks for free"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "janakhpon", email = "janakhpon@example.com"}
]
keywords = ["pdf", "audio", "audiobook", "tts", "text-to-speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "kokoro-onnx>=0.3.4",
    "soundfile>=0.12.1",
    "numpy>=1.24",
    "PyYAML>=6.0.1",
    "docling>=2.77.0",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.14.3",
    "nltk>=3.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
pdf2audio = "pdf2audio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pdf2audio"]

[tool.ruff]
line-length = 100
src = ["pdf2audio", "tests"]
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["pdf2audio"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Third-party libraries without type stubs — scope the untyped boundary here.
[[tool.mypy.overrides]]
module = ["docling.*", "ebooklib", "kokoro_onnx.*", "soundfile", "nltk", "bs4"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
